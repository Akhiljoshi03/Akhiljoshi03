name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=58A6FF'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Skillmatch-ai
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: 'username=${{ github.repository_owner }}&repo=Skillmatch-ai&theme=radical&hide_border=true&bg_color=0D1117'
          path: profile/pin-skillmatch-ai.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Spherecart
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: 'username=${{ github.repository_owner }}&repo=Spherecart&theme=radical&hide_border=true&bg_color=0D1117'
          path: profile/pin-spherecart.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stat cards" || exit 0
          git push
